# Stack completo del IER: PostgreSQL + backend (Spring Boot) + frontend (Angular/nginx).
#
#   cp .env.example .env     # y editar los valores
#   docker compose up -d --build
#
# Usa su PROPIO volumen (ier_pgdata) y un contenedor distinto de "ier-postgres":
# no toca las bases IER antiguas.
name: ier

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ier}
      POSTGRES_USER: ${POSTGRES_USER:-ier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - ier_pgdata:/var/lib/postgresql/data
    ports:
      # Solo accesible desde esta PC (útil para ./run.sh o un cliente SQL).
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "prod" no existe como archivo: simplemente evita el perfil dev.
      # Para crear el primer administrador usar IER_PROFILE=bootstrap (ver .env.example).
      SPRING_PROFILES_ACTIVE: ${IER_PROFILE:-prod}
      IER_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ier}
      IER_DB_USERNAME: ${POSTGRES_USER:-ier}
      IER_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (minimo 32 bytes) en .env}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:${WEB_PORT:-8080}}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:${WEB_PORT:-8080}}
      APP_MAIL_CONTACTO: ${APP_MAIL_CONTACTO:-}
      # Brevo por HTTPS (opcional; alternativa a SMTP en Render free).
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-IER}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Host y puerto SMTP deben llevar valor por defecto: vacíos romperían la configuración.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    expose:
      - "8080"
    healthcheck:
      # /actuator/health exige JWT, así que se comprueba solo que el puerto responda.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  ier_pgdata:
