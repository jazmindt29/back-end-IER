name: Verificación

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ier_test
          POSTGRES_USER: ier_test
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ier_test -d ier_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas con migraciones sobre PostgreSQL aislado
        env:
          IER_RUN_DB_TESTS: 'true'
          IER_TEST_DB_URL: jdbc:postgresql://127.0.0.1:55432/ier_test
          IER_TEST_DB_PASSWORD: isolated-test-only
        run: ./mvnw verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Auditoría de dependencias de ejecución
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Pruebas de interfaz
        run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome
