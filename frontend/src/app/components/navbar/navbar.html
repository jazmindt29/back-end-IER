<nav class="navbar navbar-expand-xxl navbar-dark bg-dark" aria-label="Navegación principal">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">INSTITUTO IER</a>

    <button class="navbar-toggler" type="button" (click)="menuAbierto.set(!menuAbierto())"
            aria-controls="menuPrincipal" [attr.aria-expanded]="menuAbierto()" [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAbierto()" id="menuPrincipal">
      <ul class="navbar-nav me-auto" (click)="cerrarMenu()">
        <li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/quienes-somos" routerLinkActive="active">Quiénes Somos</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/laboratorios" routerLinkActive="active">Laboratorios</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/investigadores" routerLinkActive="active">Investigadores</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/proyectos" routerLinkActive="active" ariaCurrentWhenActive="page">Proyectos</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/calendario" routerLinkActive="active">Calendario</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/contacto" routerLinkActive="active">Contacto</a></li>
        @if (auth.isAdmin) {
          <li class="nav-item"><a class="nav-link" routerLink="/admin" routerLinkActive="active">Panel Admin</a></li>
        }
        @if (auth.isInvestigador) {
          <li class="nav-item"><a class="nav-link" routerLink="/panel" routerLinkActive="active">Mi Panel</a></li>
        }
      </ul>

      <div class="d-flex align-items-center gap-3 flex-shrink-0">
        @if (auth.isLoggedIn) {
          <span class="navbar-text small text-truncate" style="max-width: 12rem;" [title]="auth.username ?? ''">
            <i class="bi bi-person-circle me-1"></i>{{ auth.username }}
          </span>
          <button class="btn btn-outline-light btn-sm" (click)="cerrarSesion()">Cerrar sesión</button>
        } @else {
          <a class="btn btn-outline-light btn-sm" routerLink="/login" (click)="cerrarMenu()">Iniciar sesión</a>
        }
      </div>
    </div>
  </div>
</nav>
