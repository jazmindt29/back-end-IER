<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <h1 class="h3 mb-4 text-center">Iniciar sesión</h1>

    @if (error) {
      <div class="alert alert-danger">{{ error }}</div>
    }

    <form #f="ngForm" (ngSubmit)="f.valid && entrar()">
      <div class="mb-3">
        <label class="form-label" for="username">Usuario</label>
        <input id="username" name="username" class="form-control" required
               [(ngModel)]="username" autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control" required
               [(ngModel)]="password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100" [disabled]="f.invalid">Entrar</button>
    </form>
  </div>
</div>
