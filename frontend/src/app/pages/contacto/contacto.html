<h1 class="mb-4">Contacto</h1>

<div class="row">
  <div class="col-md-7">
    @if (enviado) {
      <div class="alert alert-success" role="status">Tu mensaje fue registrado correctamente.</div>
    }
    @if (error) {
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    }

    <form #f="ngForm" (ngSubmit)="f.valid && enviar()">
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre</label>
        <input id="nombre" name="nombre" class="form-control" required maxlength="200" autocomplete="name"
               [(ngModel)]="modelo.nombre" #nombre="ngModel"
               [class.is-invalid]="nombre.invalid && nombre.touched">
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" class="form-control" required maxlength="254"
               email autocomplete="email"
               [(ngModel)]="modelo.email" #email="ngModel"
               [class.is-invalid]="email.invalid && email.touched">
        @if (email.invalid && email.touched) {
          <div class="invalid-feedback d-block">Ingresa un correo electrónico válido.</div>
        }
      </div>

      <div class="mb-3">
        <label class="form-label" for="asunto">Asunto</label>
        <input id="asunto" name="asunto" class="form-control" maxlength="200" [(ngModel)]="modelo.asunto">
      </div>

      <div class="mb-3">
        <label class="form-label" for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" class="form-control" rows="5" required maxlength="10000"
                  [(ngModel)]="modelo.mensaje" #mensaje="ngModel"
                  [class.is-invalid]="mensaje.invalid && mensaje.touched"></textarea>
      </div>

      <button class="btn btn-primary" [disabled]="f.invalid || enviando()">{{ enviando() ? 'Enviando…' : 'Enviar mensaje' }}</button>
    </form>
  </div>
</div>
