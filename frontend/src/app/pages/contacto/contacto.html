<h1 class="mb-4">Contacto</h1>

<div class="row">
  <div class="col-md-7">
    @if (enviado) {
      <div class="alert alert-success">Tu mensaje fue enviado. Te responderemos al correo indicado.</div>
    }
    @if (error) {
      <div class="alert alert-danger">{{ error }}</div>
    }

    <form #f="ngForm" (ngSubmit)="f.valid && enviar()">
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre</label>
        <input id="nombre" name="nombre" class="form-control" required
               [(ngModel)]="modelo.nombre" #nombre="ngModel"
               [class.is-invalid]="nombre.invalid && nombre.touched">
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Correo (Gmail institucional)</label>
        <input id="email" name="email" type="email" class="form-control" required
               [pattern]="gmailPattern"
               [(ngModel)]="modelo.email" #email="ngModel"
               [class.is-invalid]="email.invalid && email.touched">
        @if (email.errors?.['pattern'] && email.touched) {
          <div class="invalid-feedback d-block">El correo debe ser una cuenta &#64;gmail.com</div>
        }
      </div>

      <div class="mb-3">
        <label class="form-label" for="asunto">Asunto</label>
        <input id="asunto" name="asunto" class="form-control" [(ngModel)]="modelo.asunto">
      </div>

      <div class="mb-3">
        <label class="form-label" for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" class="form-control" rows="5" required
                  [(ngModel)]="modelo.mensaje" #mensaje="ngModel"
                  [class.is-invalid]="mensaje.invalid && mensaje.touched"></textarea>
      </div>

      <button class="btn btn-primary" [disabled]="f.invalid">Enviar mensaje</button>
    </form>
  </div>
</div>
