server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La API vive en el mismo origen: el navegador llama a /api y nginx la reenvía a Spring Boot.
    # Host original (con puerto) para que la validación CORS de Spring vea el mismo origen.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # index.html nunca en caché: referencia los bundles con hash de cada versión.
    location = /index.html {
        expires -1;
    }

    # Bundles con hash (outputHashing=all): caché larga.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Imágenes sin hash (p. ej. assets/pic.jpg): caché corta.
    location ~* \.(?:png|jpe?g|svg|webp|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Rutas de Angular (SPA): cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
