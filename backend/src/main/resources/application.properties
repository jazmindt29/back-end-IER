# Configuración común. Usar ./run.sh para desarrollo; producción exige variables externas.
spring.datasource.url=${IER_DB_URL:}
spring.datasource.username=${IER_DB_USERNAME:}
spring.datasource.password=${IER_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Render termina TLS en su balanceador: confiar en X-Forwarded-* para que
# Spring vea https y reconozca las llamadas del navegador como mismo origen.
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-horas=8
app.frontend-url=${APP_FRONTEND_URL:}
app.cors.origins=${APP_CORS_ORIGINS:}
app.mail.contacto-destino=${APP_MAIL_CONTACTO:}
# Brevo por HTTPS: funciona en el plan gratuito de Render (bloquea SMTP).
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.brevo-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
app.mail.remitente=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
app.mail.remitente-nombre=${APP_MAIL_FROM_NAME:IER}
app.bootstrap.admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
