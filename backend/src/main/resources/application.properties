# Configuración de la Base de Datos
# Variables propias del proyecto (IER_DB_*) para no chocar con las SPRING_DATASOURCE_*
# globales de otros proyectos. Los defaults apuntan al contenedor Docker de desarrollo
# (ier-postgres); en producción define IER_DB_URL / IER_DB_USERNAME / IER_DB_PASSWORD.
# Arrancar con ./run.sh, que neutraliza las SPRING_DATASOURCE_* del entorno.
spring.datasource.url=${IER_DB_URL:jdbc:postgresql://localhost:5432/IER}
spring.datasource.username=${IER_DB_USERNAME:postgres}
spring.datasource.password=${IER_DB_PASSWORD:jazmin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# 'update' para que Hibernate agregue las columnas/tablas nuevas (reservas, avisos,
# token de invitación, etc.) sin tocar las existentes creadas manualmente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (HS256). En producción JWT_SECRET debe venir del entorno (mínimo 32 bytes)
app.jwt.secret=${JWT_SECRET:ier-secreto-de-desarrollo-cambiar-en-produccion!}
app.jwt.expiracion-horas=8

# URL pública del frontend (para armar el enlace de invitación) y origins permitidos de CORS
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:4200}

# Correo del departamento que recibe las notificaciones del formulario de contacto
app.mail.contacto-destino=${APP_MAIL_CONTACTO:}

# SMTP (Gmail institucional). Sin SPRING_MAIL_USERNAME/PASSWORD los envíos
# fallan de forma controlada y el contenido queda en el log del servidor
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
