# Configuración común. Usar ./run.sh para desarrollo; producción exige variables externas.
spring.datasource.url=${IER_DB_URL:}
spring.datasource.username=${IER_DB_USERNAME:}
spring.datasource.password=${IER_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-horas=8
app.frontend-url=${APP_FRONTEND_URL:}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:4200}
app.mail.contacto-destino=${APP_MAIL_CONTACTO:}
app.bootstrap.admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
